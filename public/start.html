<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GemAPI · Formation BeAPI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      min-height: 100vh;
      background-color: #070707;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
    }

    .bar-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: #FFE000;
      z-index: 10;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: clamp(11px, 1vw, 14px);
      letter-spacing: 0.24em;
      color: #FFE000;
      opacity: 0.6;
      text-transform: uppercase;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(34px, 4.2vw, 56px);
      text-align: center;
      line-height: 1.15;
      color: #fff;
      letter-spacing: -0.025em;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
    }

    h1 span {
      color: #FFE000;
    }

    .qr-wrapper {
      position: relative;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
    }

    .qr-frame {
      background: #fff;
      padding: 16px;
      border: 3px solid #FFE000;
      box-shadow: 0 0 60px rgba(255, 224, 0, 0.12);
      animation: pulse-glow 3.5s ease-in-out 1.2s infinite;
    }

    /* corner accents */
    .corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border-color: #FFE000;
      border-style: solid;
    }
    .corner.tl { top: -8px; left: -8px; border-width: 2px 0 0 2px; }
    .corner.tr { top: -8px; right: -8px; border-width: 2px 2px 0 0; }
    .corner.bl { bottom: -8px; left: -8px; border-width: 0 0 2px 2px; }
    .corner.br { bottom: -8px; right: -8px; border-width: 0 2px 2px 0; }

    .url {
      font-family: 'DM Mono', monospace;
      font-size: clamp(18px, 2vw, 26px);
      color: #FFE000;
      letter-spacing: 0.05em;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
    }

    .logos {
      display: flex;
      align-items: center;
      gap: 18px;
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
      opacity: 0.5;
    }

    .logo-img {
      height: 32px;
      border-radius: 5px;
    }

    .logo-sep {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.2);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 1px rgba(255,224,0,0.1), 0 0 40px rgba(255,224,0,0.08); }
      50%       { box-shadow: 0 0 0 1px rgba(255,224,0,0.4), 0 0 90px rgba(255,224,0,0.24); }
    }
  </style>
</head>
